[project]
name = "scribely"
version = "0.1.0"
description = "Scribely backend sidecar: audio capture, live transcription, and notes pipeline."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "platformdirs>=4.3",
    "structlog>=24.4",
    "numpy>=2.5.4",
    "soxr>=1.1.0",
    "pyaudiowpatch>=0.2.12.9 ; sys_platform == 'win32'",
    "pyobjc-framework-screencapturekit>=12.2.2 ; sys_platform == 'darwin'",
    "pyobjc-framework-coremedia>=12.2.2 ; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=12.2.2 ; sys_platform == 'darwin'",
    "pyobjc-framework-libdispatch>=12.2.2 ; sys_platform == 'darwin'",
    "faster-whisper>=1.2.1",
    "langgraph>=1.2.17",
    "langchain-core>=1.7.0",
    "langchain-openai>=1.7.2",
    "langchain-anthropic>=1.7.6",
    "langchain-google-genai>=4.4.2",
    "langchain-ollama>=1.1.0",
    "httpx>=0.28.1",
]

[project.scripts]
scribely-backend = "scribely.__main__:main"
scribely-capture-check = "scribely.capture.check:main"
scribely-transcribe-check = "scribely.stt.check:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pydantic-to-typescript>=2.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Platform-only (PyAudioWPatch on Windows, PyObjC on macOS) or untyped packages.
module = ["pyaudiowpatch", "objc", "Foundation", "CoreMedia", "Quartz", "ScreenCaptureKit", "dispatch", "soxr", "faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
