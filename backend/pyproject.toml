[project]
name = "scribely"
version = "0.1.0"
description = "Scribely backend sidecar: audio capture, live transcription, and notes pipeline."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "platformdirs>=4.3",
    "structlog>=24.4",
]

[project.scripts]
scribely-backend = "scribely.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pydantic-to-typescript>=2.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
